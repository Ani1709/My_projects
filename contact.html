<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - My Website</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- Skip to Main Content -->
    <a href="#main-content" class="skip-link">
        Skip to Main Content
    </a>


    <!-- Header -->
    <header>

        <h1>Contact Me</h1>

    </header>


    <!-- Navigation -->
    <nav>

        <img
            src="./images/contact-nav.jpg"
            alt="Contact"
        >

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="about.html">About</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>


    <!-- Main -->
    <main id="main-content">

        <div class="container">

            <h2>Contact Me</h2>

            <p>
                If you would like to contact me, please complete
                the form below.
            </p>


            <!-- Bootstrap Form -->

            <form>

                <div class="mb-3">

                    <label for="name" class="form-label">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="mb-3">

                    <label for="message" class="form-label">
                        Message
                    </label>

                    <textarea
                        id="message"
                        class="form-control"
                        rows="5"
                        placeholder="Enter your message"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Submit
                </button>

            </form>

        </div>

    </main>


    <!-- Footer -->
    <footer class="text-center">

        <p>© 2026 My Website</p>

    </footer>


</body>

</html>
